[package]
name = "pb-core"
description = "ProtoBench core: schema, framing, codec, transports, telemetry, recording, sequences"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parquet"]
# Parquet export (`decode --parquet`, Record > Export Parquet).
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
# SEGGER RTT through debug probes (probe-rs). On by default in the CLI and
# GUI; off here so the library builds quickly without it.
rtt = ["dep:probe-rs", "dep:object"]
# BLE GATT through btleplug (needs D-Bus on Linux). Off by default.
ble = ["dep:btleplug", "dep:tokio", "dep:futures-util", "dep:uuid"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
probe-rs = { workspace = true, optional = true }
object = { workspace = true, optional = true }
btleplug = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
cobs.workspace = true
crc.workspace = true
crossbeam-channel.workspace = true
evalexpr.workspace = true
mcap.workspace = true
parking_lot.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
protox.workspace = true
rhai.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serialport.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tungstenite.workspace = true
miette.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true

[dev-dependencies]
proptest.workspace = true
